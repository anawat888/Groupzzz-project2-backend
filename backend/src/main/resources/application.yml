server:
  port: 8080

spring:
  application:
    name: smartmath-backend
  profiles:
    active:
      - db
      - local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:smartmath}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration: 86400000
      refresh-token:
        expiration: 604800000

supabase:
  storage:
    endpoint: ${SUPABASE_STORAGE_ENDPOINT:}
    region: ${SUPABASE_STORAGE_REGION:ap-southeast-1}
    access-key: ${SUPABASE_STORAGE_ACCESS_KEY:}
    secret-key: ${SUPABASE_STORAGE_SECRET_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:profile-images}
    public-url: ${SUPABASE_STORAGE_PUBLIC_URL:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
