# Render Blueprint: creates the PostgreSQL database and the backend web service together
databases:
  - name: smartmath-db
    databaseName: smartmath
    user: smartmath
    plan: free
    region: singapore

services:
  - type: web
    name: smartmath-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: PORT
        value: 8080
      - key: DB_HOST
        fromDatabase:
          name: smartmath-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartmath-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: smartmath-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smartmath-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartmath-db
          property: password
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      # sync: false = Render asks you to type the value when you create the Blueprint (secrets are not in git)
      - key: JWT_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        value: ap-northeast-2
      - key: SUPABASE_STORAGE_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: profile-images
      - key: SUPABASE_STORAGE_PUBLIC_URL
        sync: false
