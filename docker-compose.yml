services:
  db:
    image: postgres:16
    container_name: smartmath-postgres
    environment:
      POSTGRES_DB: smartmath
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  adminer:
    image: adminer
    ports:
      - "9000:8080"
volumes:
  pgdata: